site:
  name: Coding Challenges
  site: 'http://www.evilznet.com'
  base: '/coding-challenges'
  trailingSlash: false

  googleSiteVerificationId:

metadata:
  title:
    default: Coding Challenges
    template: '%s — Coding Challenges'
  description: 'A consolidated catalog of coding challenges, technical tests, and programming contests.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Coding Challenges
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle:
    site:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'system'
